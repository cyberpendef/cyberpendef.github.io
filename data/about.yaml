values:
  title: Brand Values
  subtitle: What CyberPenDef Stands For
  theme: green
  icon: 🌱
  items:
  - icon: ⚡
    title: Speed Without Compromise
    description: AI tools accelerate every stage of delivery — from diagnosis to reporting — so clients get results
      faster, without sacrificing depth or accuracy.
  - icon: 💸
    title: Accessible Pricing
    description: Professional cybersecurity and IT services shouldn't be out of reach for individuals and small
      businesses. Fair, transparent pricing is a core commitment.
  - icon: 🔏
    title: Your Data, Your Privacy
    description: Client data is handled with strict confidentiality. It is never shared with third parties, never
      retained beyond the engagement, and always treated with the utmost respect.
  - icon: 📊
    title: Radical Transparency
    description: No black boxes. Every project concludes with a clear, written report — what was done, what was
      discovered, and exactly what steps to take next.
cta_quote: If you're looking for a cybersecurity and IT professional who communicates clearly, delivers honestly,
  and genuinely cares about your outcome — I'd love to work with you.
