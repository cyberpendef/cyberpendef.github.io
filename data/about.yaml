introduction:
  title: Personal Introduction
  subtitle: Hi, I'm Hidayatullah — and I genuinely enjoy solving tech problems.
  theme: violet
  icon: 👤
  paragraphs:
  - I've been the person friends and family call when something goes wrong with their computer since I was a teenager.
    What started as a natural curiosity for how systems work grew into a professional career in IT and cybersecurity
    — and eventually into **CyberPenDef**, my own practice for delivering affordable, expert-level digital services
    to people who deserve better than confusing, overpriced tech support.
  - I hold a **CEH (Certified Ethical Hacker)** certification from EC-Council and bring **3 years of professional
    IT and cybersecurity experience** alongside **8+ years of hands-on personal computer and IT troubleshooting
    experience**. I've worked on real-world system administration, participated in cybersecurity labs and Capture
    the Flag (CTF) challenges, and built automation tools using Python, C, and other programming languages. I stay
    sharp by continuously learning and practicing in environments that mirror real attacker techniques.
  - I started CyberPenDef because I believe cybersecurity and reliable IT support shouldn't be the exclusive privilege
    of large enterprises with big budgets. Individuals, freelancers, and small business owners deserve the same
    protection and quality of service — delivered in plain language, at a fair price, with complete transparency.
approach:
  title: My Approach
  subtitle: How I Work With Clients
  theme: cyan
  icon: 🎯
  steps:
  - label: Step 1 — Listen First
    description: Every engagement starts with a free discovery conversation. I take time to understand your specific
      situation, goals, and budget before recommending anything.
  - label: Step 2 — Clear Proposal
    description: You receive a plain-language proposal with a fixed price and defined scope. No hidden fees, no
      scope creep surprises.
  - label: Step 3 — AI-Assisted
    description: I use the latest AI tools to accelerate diagnostics, report generation, and routine tasks — so
      you get faster results without cutting corners on quality.
  - label: Step 4 — Transparency
    description: At project completion you receive a detailed, jargon-free report of exactly what was done, what
      was found, and what you should do next.
  - label: Step 5 — Continued Support
    description: I'm reachable after delivery for follow-up questions. For ongoing clients, I offer maintenance
      subscriptions that keep your systems healthy month after month.
