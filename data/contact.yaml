delivery:
  title: Location & Delivery
  subtitle: Remote First
  paragraphs:
    - "**CyberPenDef is a fully remote practice** based in India, Andhra Pradesh, Kurnool, serving clients across India and the Middle East & Gulf region (UAE, Saudi Arabia, Qatar, Kuwait, Bahrain, and Oman). But you can also physically meet me offline at my home location for some specific services that require on-site presence. You have to Opt for Offline mode in the inquiry form to reach me out. Details of my home address will be provided once you contact me via enquiry form or phone call accordingly. Just ask when you reach out."
    - All services are delivered in both offline mode and online mode. For online mode, all services are delivered remotely via secure screen-sharing, email, and cloud collaboration tools — no on-site visit required.
    - Remote delivery means faster response times, lower costs passed on to you, and the ability to work with clients regardless of location — without ever compromising on the quality or depth of service.
