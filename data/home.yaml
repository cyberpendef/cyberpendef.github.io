promotion:
  title: 'Limited Offer — First 5 to 7 Clients:'
  text: I'm currently accepting my first clients and offering a completely free initial consultation — no strings
    attached. Let's talk about your IT or security challenge and figure out the best path forward together.
edge:
  title: The CyberPenDef Edge
  subtitle: What Sets Us Apart
  theme: green
  icon: ⚡
  items:
  - icon: ⚡
    title: AI-Powered Speed
    description: Every service I deliver is augmented with AI tooling — cutting turnaround times dramatically so
      you get results faster without paying enterprise rates.
  - icon: 💸
    title: Affordable Fixed Pricing
    description: No hourly surprises. Every project comes with a transparent, agreed-upon price upfront — so you
      always know exactly what you're paying before work begins.
  - icon: 🔏
    title: Privacy-First Approach
    description: Your data stays yours. I never share, sell, or retain client data beyond what's strictly required
      to deliver your service. Full stop.
  - icon: 📊
    title: Transparent Reporting
    description: Every engagement ends with a clear, plain-language report — no jargon, no confusion. You'll always
      know exactly what was done, what was found, and what to do next.
overview:
  title: Overview
  subtitle: What I Can Do For You
  theme: blue
  icon: 🛡️
  paragraphs:
  - Whether you're an individual who needs their computer sorted, a non-technical freelancer managing sensitive
    client data, or a small business that wants to stop worrying about cyberattacks — I have a service built for
    your exact situation. All services are delivered remotely and completed with clear timelines and pricing agreed
    in advance.
  - I work across **four core areas:** personal IT support, personal cybersecurity, business IT infrastructure,
    and business cybersecurity — covering everything from parental controls and device health checks to secure code
    audits and full Security-as-a-Service packages.
audience:
  title: Audience
  subtitle: Who CyberPenDef Is Built For
  theme: amber
  icon: 👥
  items:
  - label: Individuals
    quote: You use the internet every day — but is it safe?
    description: From setting up your home Wi-Fi securely to recovering a hacked account, I help everyday users
      protect their digital life without needing a tech background. If something feels off with your device or online
      accounts, I'm one message away.
  - label: Freelancers
    quote: Your business runs on your laptop — let's protect it.
    description: As a non-technical freelancer, your income depends on your tools working and your client data staying
      private. I handle your IT backbone — backups, secure communications, system maintenance — so you never lose
      a client deadline to a tech failure.
  - label: Small Businesses
    quote: Enterprise-grade security. Small business budget.
    description: You don't need a full-time IT team to stay secure and operational. I provide ongoing remote support,
      cloud migration assistance, automated backups, and cybersecurity management — customized to the size and budget
      of your business.
