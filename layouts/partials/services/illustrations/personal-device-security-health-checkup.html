<div class="infographic-placeholder" style="min-height: 320px;">
<svg width="100%" height="100%" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <filter id="hyperGlow5" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur stdDeviation="5" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>

                        <!-- Background Tech Grid -->
                        <path d="M50 250 H550" stroke="var(--border)" stroke-width="1" opacity="0.2" />
                        <path d="M50 50 V250" stroke="var(--border)" stroke-width="1" opacity="0.2" />

                        <!-- Diagnostic Scanner Body -->
                        <g transform="translate(150, 60)">
                            <rect x="0" y="0" width="300" height="140" rx="12" fill="rgba(13, 17, 23, 0.8)" stroke="var(--border)" stroke-width="2" />
                            
                            <!-- Internal Diagnostic UI -->
                            <rect x="20" y="20" width="260" height="100" rx="4" fill="#000" opacity="0.5" />
                            
                            <!-- Scanning Line -->
                            <rect x="20" y="20" width="260" height="2" fill="var(--cyan)" filter="url(#hyperGlow5)">
                                <animate attributeName="y" values="20;118;20" dur="4s" repeatCount="indefinite" />
                            </rect>

                            <!-- Malware Detection Hits -->
                            <circle cx="80" cy="50" r="4" fill="#ff4400" filter="url(#hyperGlow5)">
                                <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
                            </circle>
                            <circle cx="200" cy="80" r="4" fill="#ff4400" filter="url(#hyperGlow5)">
                                <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.3s" repeatCount="indefinite" />
                            </circle>
                        </g>

                        <!-- AI Logic Node -->
                        <g transform="translate(300, 130)">
                            <path d="M-30 0 L0 -30 L30 0 L0 30 Z" fill="var(--bg)" stroke="var(--cyan)" stroke-width="2" filter="url(#hyperGlow5)" />
                            <text x="0" y="5" fill="var(--cyan)" font-family="var(--font-mono)" font-size="12" text-anchor="middle" font-weight="bold">AI</text>
                        </g>

                        <!-- Summary -->
                        <g transform="translate(300, 240)">
                            <text x="0" y="0" fill="var(--white)" font-family="var(--font-body)" font-size="14" text-anchor="middle" font-weight="600">Deep System Vulnerability Analysis</text>
                            <text x="0" y="25" fill="var(--muted)" font-family="var(--font-mono)" font-size="11" text-anchor="middle">Hidden Malware Detection • Privacy Audit • Dark Web Check</text>
                        </g>
                    </svg>
</div>
