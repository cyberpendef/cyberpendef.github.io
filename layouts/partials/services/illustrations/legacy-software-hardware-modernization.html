<div class="infographic-placeholder" style="min-height: 320px;">
<svg width="100%" height="100%" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <filter id="hyperGlow13" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur stdDeviation="5" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>
                        <!-- Legacy System (Left) -->
                        <g transform="translate(80, 100)">
                            <rect x="0" y="0" width="80" height="80" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="2" />
                            <!-- Pixelated icon -->
                            <rect x="20" y="20" width="10" height="10" fill="var(--muted)" />
                            <rect x="35" y="35" width="10" height="10" fill="var(--muted)" />
                            <rect x="50" y="50" width="10" height="10" fill="var(--muted)" />
                            <text x="40" y="110" fill="var(--muted)" font-family="var(--font-mono)" font-size="9" text-anchor="middle">OUTDATED</text>
                        </g>

                        <!-- Scanning Barrier -->
                        <rect x="280" y="50" width="4" height="180" fill="var(--cyan)" filter="url(#hyperGlow13)">
                            <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
                        </rect>

                        <!-- Modern System (Right) -->
                        <g transform="translate(440, 100)">
                            <rect x="0" y="0" width="80" height="80" rx="16" fill="var(--card)" stroke="var(--green)" stroke-width="2" filter="url(#hyperGlow13)" />
                            <!-- Sleek icon -->
                            <circle cx="40" cy="40" r="15" stroke="var(--green)" stroke-width="2" />
                            <path d="M40 30 V50 M30 40 H50" stroke="var(--green)" stroke-width="2" />
                            <text x="40" y="110" fill="var(--green)" font-family="var(--font-mono)" font-size="9" text-anchor="middle" font-weight="bold">MODERNIZED</text>
                        </g>

                        <!-- Summary -->
                        <g transform="translate(300, 260)">
                            <text x="0" y="0" fill="var(--white)" font-family="var(--font-body)" font-size="14" text-anchor="middle" font-weight="600">Risk-Free Software & Hardware Upgrades</text>
                        </g>
                    </svg>
</div>
