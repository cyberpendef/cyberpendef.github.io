<div class="infographic-placeholder" style="min-height: 320px;">
<svg width="100%" height="100%" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <filter id="hyperGlow16" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur stdDeviation="5" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>
                        <!-- User Identity -->
                        <g transform="translate(100, 120)">
                            <circle cx="0" cy="0" r="30" fill="var(--surface)" stroke="var(--border)" stroke-width="2" />
                            <text x="0" y="10" fill="var(--white)" font-family="var(--font-mono)" font-size="20" text-anchor="middle">👤</text>
                        </g>
                        <!-- The MFA Challenge -->
                        <g transform="translate(300, 120)">
                            <rect x="-40" y="-60" width="80" height="120" rx="10" fill="var(--bg)" stroke="var(--amber)" stroke-width="2" filter="url(#hyperGlow16)" />
                            <text x="0" y="-10" fill="var(--amber)" font-family="var(--font-mono)" font-size="20" text-anchor="middle">🔑</text>
                            <text x="0" y="25" fill="var(--amber)" font-family="var(--font-mono)" font-size="10" text-anchor="middle" font-weight="bold">MFA</text>
                            <text x="0" y="40" fill="var(--amber)" font-family="var(--font-mono)" font-size="10" text-anchor="middle" font-weight="bold">VALIDATE</text>
                        </g>
                        <!-- Access Granted (Animated) -->
                        <g transform="translate(500, 120)">
                            <path d="M-20 0 L0 20 L40 -20" stroke="var(--green)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#hyperGlow16)" opacity="0">
                                <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
                            </path>
                            <text x="10" y="50" fill="var(--green)" font-family="var(--font-mono)" font-size="10" text-anchor="middle" font-weight="bold">IDENTITY VERIFIED</text>
                        </g>
                    </svg>
</div>
