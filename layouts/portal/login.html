{{ define "main" }}
{{ $copy := site.Data.portal.login }}

<div class="page-hero stagger-in">
    <div class="hero-badge"><span class="dot" style="background: var(--cyan);"></span> {{ $copy.hero_badge }}</div>
    <h1 class="hero-title">{{ $copy.title_prefix }} <span>{{ $copy.title_highlight }}</span></h1>
    <p class="lead">{{ $copy.description }}</p>
</div>

<div class="stagger-in delay-1" style="max-width: 500px; margin: 40px auto 100px;">
    <div id="authContainer" style="background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px;">
        
        <h2 style="font-family: var(--font-mono); font-size: 1.5rem; color: var(--cyan); margin-bottom: 30px; text-align: center; text-transform: uppercase; letter-spacing: 2px;">{{ $copy.form_title }}</h2>

        <form id="authForm"
            data-submit-label="{{ $copy.submit_label }}"
            data-verifying-label="{{ $copy.verifying_label }}"
            data-turnstile-error="{{ $copy.turnstile_error }}"
            data-error-prefix="{{ $copy.error_prefix }}"
            data-generic-error="{{ $copy.generic_error }}">
            <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label" style="display: block; font-family: var(--font-mono); font-size: 0.75rem; color: var(--cyan); margin-bottom: 8px; text-transform: uppercase;">{{ $copy.email_label }}</label>
                <input type="email" id="email" class="form-input" placeholder="{{ $copy.email_placeholder }}" required style="width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; color: var(--white); font-family: var(--font-body);">
            </div>
            
            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label" style="display: block; font-family: var(--font-mono); font-size: 0.75rem; color: var(--cyan); margin-bottom: 8px; text-transform: uppercase;">{{ $copy.password_label }}</label>
                <input type="password" id="password" class="form-input" placeholder="{{ $copy.password_placeholder }}" required style="width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; color: var(--white); font-family: var(--font-body);">
            </div>

            <!-- Cloudflare Turnstile Widget -->
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAC1OBXLHWUcaUlZ0" data-theme="dark" style="margin-bottom: 20px; display: flex; justify-content: center;"></div>

            <button type="submit" id="authBtn" class="btn btn-primary" style="width: 100%; padding: 18px; font-weight: 700;">{{ $copy.submit_label }}</button>
        </form>

        <div style="margin-top: 25px; text-align: center; font-family: var(--font-mono); font-size: 0.85rem;">
            <span style="color: var(--muted);">{{ $copy.signup_prompt }}</span>
            <a href="/portal/signup" style="color: var(--cyan); text-decoration: none; border-bottom: 1px dashed var(--cyan); margin-left: 5px;">{{ $copy.signup_link_label }}</a>
        </div>

        <div id="authFeedback" style="margin-top: 25px; padding: 15px; border-radius: var(--radius); display: none; text-align: center;"></div>
        
    </div>
</div>

<!-- Turnstile SDK -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = 'https://qfkdrluonrhmubqyeyex.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFma2RybHVvbnJobXVicXlleWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NDk4MjcsImV4cCI6MjA5MTAyNTgyN30.YKXk70kUibQJNhG-AIwyGLChl_mta-lqm-Sm27N41os';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authBtn = document.getElementById('authBtn');
    const authForm = document.getElementById('authForm');
    const feedback = document.getElementById('authFeedback');
    const messages = authForm.dataset;

    authForm.addEventListener('submit', async (e) => {
        e.preventDefault(); 
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Frontend Turnstile Check
        const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]');
        if (!turnstileResponse || !turnstileResponse.value) {
            feedback.style.display = 'block';
            feedback.style.backgroundColor = 'rgba(255, 184, 0, 0.1)';
            feedback.style.border = '1px solid rgba(255, 184, 0, 0.3)';
            feedback.style.color = 'var(--amber)';
            feedback.textContent = messages.turnstileError;
            return;
        }

        authBtn.disabled = true;
        authBtn.innerText = messages.verifyingLabel;
        feedback.style.display = 'none';

        try {
            // Log In
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
                options: { captchaToken: turnstileResponse.value } 
            });

            if (error) throw error;

            // Successful Login -> Redirect to Dashboard instantly
            window.location.href = '/portal/dashboard';

        } catch (error) {
            console.error("Auth Error: ", error);
            feedback.style.display = 'block';
            feedback.style.backgroundColor = 'rgba(255, 68, 68, 0.1)';
            feedback.style.border = '1px solid rgba(255, 68, 68, 0.3)';
            feedback.style.color = '#ff4444';
            feedback.textContent = `${messages.errorPrefix} ${error.message || messages.genericError}`;
            if (typeof turnstile !== 'undefined') {
                turnstile.reset();
            }
        } finally {
            authBtn.disabled = false;
            authBtn.innerText = messages.submitLabel;
        }
    });

    // Automatically check if user is already logged in
    async function checkSession() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            window.location.href = '/portal/dashboard';
        }
    }
    
    // Listen for Auth State Changes (important for when user clicks email confirmation link)
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) {
            window.location.href = '/portal/dashboard';
        }
    });

    checkSession();
</script>

{{ end }}
