  - name: blog
    label: Blog
    label_singular: Blog Post
    folder: content/blog
    create: true
    delete: true
    path: "{{slug}}"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Description, name: description, widget: text }
      - label: Category
        name: category
        widget: select
        default: Security Guidance
        options:
          - Security Guidance
          - IT Support
          - Threat Awareness
          - Cloud Security
          - Privacy
          - Business Security
          - AI Security
      - label: Tags
        name: tags
        widget: list
        required: false
        hint: "Add short topic labels such as phishing, backups, endpoint security, or cloud."
        field: { label: Tag, name: tag, widget: string }
      - { label: Reading Time, name: reading_time, widget: string, required: false, hint: "Example: 4 min read" }
      - { label: Accent Color, name: accent_color, widget: color, default: "#00d4ff", required: false }
      - { label: Featured Post, name: featured, widget: boolean, default: false }
      - { label: SEO Title, name: seo_title, widget: string, required: false }
      - { label: SEO Description, name: seo_description, widget: text, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Featured Image, name: featured_image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: portfolio
    label: Portfolio
    label_singular: Portfolio Entry
    folder: content/portfolio
    create: true
    delete: true
    path: "{{slug}}"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Summary, name: description, widget: text }
      - { label: Client Name, name: client_name, widget: string, required: false, hint: "Keep empty for anonymized case studies." }
      - label: Client Type
        name: client_type
        widget: select
        required: false
        options:
          - Individual
          - Freelancer
          - Small Business
          - Startup
          - Corporate
      - label: Service Category
        name: service_category
        widget: select
        options:
          - IT Support
          - Cybersecurity
          - Cloud Security
          - Vulnerability Assessment
          - Penetration Testing
          - Infrastructure
          - Other
      - { label: Challenge, name: challenge, widget: text, required: false }
      - { label: Solution, name: solution, widget: text, required: false }
      - { label: Outcome, name: outcome, widget: string, required: false }
      - label: Tools Used
        name: tools_used
        widget: list
        required: false
        field: { label: Tool, name: tool, widget: string }
      - label: Metrics
        name: metrics
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string, hint: "e.g. Threat Reduction" }
          - { label: Value, name: value, widget: string, hint: "e.g. 98%" }
      - { label: Accent Color, name: accent_color, widget: color, default: "#00d4ff", required: false }
      - { label: Featured Project, name: featured, widget: boolean, default: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Featured Image, name: featured_image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown, hint: "Detailed case study description and technical breakdown." }
