            widget: object
            fields:
              - { label: Section Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Icon, name: icon, widget: string }
              - label: Theme
                name: theme
                widget: select
                options: [violet, cyan, amber, green]
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: markdown }
          - label: Approach
            name: approach
            widget: object
            fields:
              - { label: Section Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Icon, name: icon, widget: string }
              - label: Theme
                name: theme
                widget: select
                options: [violet, cyan, amber, green]
              - label: Steps
                name: steps
                widget: list
                fields:
                  - { label: Step Label, name: label, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: Credentials
            name: credentials
            widget: object
            fields:
              - { label: Section Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Icon, name: icon, widget: string }
              - label: Theme
                name: theme
                widget: select
                options: [violet, cyan, amber, green]
              - label: Credential Rows
                name: items
                widget: list
                fields:
                  - { label: Row Label, name: label, widget: string }
                  - label: Value Segments
                    name: segments
                    widget: list
                    fields:
                      - { label: Text, name: text, widget: string }
                      - { label: Emphasize Text, name: bold, widget: boolean, default: false }
                  - { label: Note, name: note, widget: text, required: false }
          - label: Brand Values
            name: values
            widget: object
            fields:
              - { label: Section Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Icon, name: icon, widget: string }
              - label: Theme
                name: theme
                widget: select
                options: [violet, cyan, amber, green]
              - label: Values
                name: items
                widget: list
                fields:
                  - { label: Icon, name: icon, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
          - { label: Call to Action Quote, name: cta_quote, widget: text }

  - name: home_content
    label: Home Page Content
    files:
      - name: home_content
        label: Homepage Sections
        file: data/home.yaml
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Badge, name: badge, widget: string }
              - { label: Title Prefix, name: title_prefix, widget: string }
              - { label: Title Highlight, name: title_highlight, widget: string }
              - { label: Description, name: description, widget: markdown }
              - label: Buttons
                name: buttons
                widget: list
                fields:
                  - { label: Button Label, name: label, widget: string }
                  - { label: Link, name: url, widget: string }
                  - label: Style
                    name: kind
                    widget: select
                    options: [primary, outline]
          - label: Promotion
            name: promotion
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - label: CyberPenDef Edge
            name: edge
            widget: object
            fields:
              - { label: Section Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Icon, name: icon, widget: string }
              - { label: Theme, name: theme, widget: hidden, default: green }
              - label: Cards
                name: items
                widget: list
                fields:
                  - { label: Icon, name: icon, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: Overview
            name: overview
            widget: object
            fields:
              - { label: Section Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Icon, name: icon, widget: string }
              - { label: Theme, name: theme, widget: hidden, default: blue }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: markdown }
          - label: Audience
            name: audience
            widget: object
            fields:
              - { label: Section Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Icon, name: icon, widget: string }
              - { label: Theme, name: theme, widget: hidden, default: amber }
              - label: Audience Groups
                name: items
                widget: list
                fields:
                  - { label: Group Name, name: label, widget: string }
                  - { label: Quote, name: quote, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: Credentials
            name: credentials
            widget: object
            fields:
              - { label: Section Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Icon, name: icon, widget: string }
              - { label: Theme, name: theme, widget: hidden, default: violet }
              - { label: Icon Style, name: icon_style, widget: hidden, default: violet }
              - label: Credential Items
                name: items
                widget: list
                fields:
                  - { label: Icon, name: icon, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: Call to Action
            name: cta
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Buttons
                name: buttons
                widget: list
                fields:
                  - { label: Button Label, name: label, widget: string }
                  - { label: Link, name: url, widget: string, required: false }
                  - label: External Profile
                    name: provider
                    widget: select
                    required: false
                    options:
                      - { label: No external profile, value: "" }
                      - { label: Fiverr, value: fiverr }
                      - { label: LinkedIn, value: linkedin }
                  - label: Style
                    name: kind
                    widget: select
                    options: [primary, outline]

  - name: contact_content
    label: Contact Page Content
    files:
      - name: contact_content
        label: Contact Page Sections
        file: data/contact.yaml
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Badge, name: badge, widget: string }
              - { label: Title Prefix, name: title_prefix, widget: string }
              - { label: Title Highlight, name: title_highlight, widget: string }
