              - { label: Section Subtitle, name: subtitle, widget: string }
              - { label: Name Label, name: name_label, widget: string }
              - { label: Name Placeholder, name: name_placeholder, widget: string }
              - { label: Email Label, name: email_label, widget: string }
              - { label: Email Placeholder, name: email_placeholder, widget: string }
              - { label: Phone Label, name: phone_label, widget: string }
              - { label: Phone Placeholder, name: phone_placeholder, widget: string }
              - { label: Audience Label, name: audience_label, widget: string }
              - { label: Audience Placeholder, name: audience_placeholder, widget: string }
              - label: Audience Options
                name: audiences
                widget: list
                field: { label: Audience, name: audience, widget: string }
              - { label: Service Label, name: service_label, widget: string }
              - { label: Service Placeholder, name: service_placeholder, widget: string }
              - label: Service Options
                name: services
                widget: list
                fields:
                  - { label: Form Value, name: value, widget: string }
                  - { label: Display Label, name: label, widget: string }
              - { label: Message Label, name: message_label, widget: string }
              - { label: Message Placeholder, name: message_placeholder, widget: text }
              - { label: Consultation Label, name: consultation_label, widget: string }
              - { label: Emphasized Offer Text, name: consultation_emphasis, widget: string }
              - { label: Submit Button, name: submit_label, widget: string }
              - { label: Submitting Button, name: sending_label, widget: string }
              - { label: Turnstile Error, name: turnstile_error, widget: string }
              - { label: Success Title, name: success_title, widget: string }
              - { label: Success Message, name: success_message, widget: string }
              - { label: Fallback Error, name: fallback_error, widget: string }
              - { label: Response Note, name: response_note, widget: string }
              - { label: Response Link Label, name: response_link_label, widget: string }
              - { label: Response Note Ending, name: response_note_suffix, widget: string }
          - label: Contact Channels
            name: channels
            widget: object
            fields:
              - { label: Section Title, name: title, widget: string }
              - { label: Section Subtitle, name: subtitle, widget: string }
              - label: Channels
                name: items
                widget: list
                fields:
                  - { label: Icon, name: icon, widget: string }
                  - { label: Channel Name, name: label, widget: string }
                  - label: Value Source
                    name: value_source
                    widget: select
                    options:
                      - { label: Custom Text, value: none }
                      - { label: Site Email, value: email }
                      - { label: Site Phone, value: phone }
                  - { label: Custom Display Value, name: value, widget: string, required: false }
                  - { label: Supporting Note, name: note, widget: text, required: false }
                  - label: External Profile
                    name: link_provider
                    widget: select
                    options:
                      - { label: No Profile Link, value: none }
                      - { label: LinkedIn, value: linkedin }
                      - { label: Fiverr, value: fiverr }
                  - { label: Profile Link Text, name: link_label, widget: string, required: false }
          - label: Business Hours
            name: hours
            widget: object
            fields:
              - { label: Section Title, name: title, widget: string }
              - { label: Section Subtitle, name: subtitle, widget: string }
              - { label: Time Zone Label, name: timezone_label, widget: string }
              - label: Days and Hours
                name: days
                widget: list
                fields:
                  - { label: Day, name: day, widget: string }
                  - { label: Opening Hours, name: hours, widget: string }
                  - { label: Status, name: status, widget: string }
              - { label: Time Zone Note, name: timezone_note, widget: markdown }
          - label: Location and Delivery
            name: delivery
            widget: object
            fields:
              - { label: Section Title, name: title, widget: string }
              - { label: Section Subtitle, name: subtitle, widget: string }
              - label: Delivery Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: markdown }

  - name: portal_content
    label: Client Portal Content
    files:
      - name: portal_copy
        label: Portal Pages Copy
        file: data/portal.yaml
        fields:
          - label: Login Page
            name: login
            widget: object
            fields:
              - { label: Hero Badge, name: hero_badge, widget: string }
              - { label: Title Prefix, name: title_prefix, widget: string }
              - { label: Title Highlight, name: title_highlight, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Form Heading, name: form_title, widget: string }
              - { label: Email Label, name: email_label, widget: string }
              - { label: Email Placeholder, name: email_placeholder, widget: string }
              - { label: Password Label, name: password_label, widget: string }
              - { label: Password Placeholder, name: password_placeholder, widget: string }
              - { label: Submit Button, name: submit_label, widget: string }
              - { label: Verifying Button, name: verifying_label, widget: string }
              - { label: Signup Prompt, name: signup_prompt, widget: string }
              - { label: Signup Link Label, name: signup_link_label, widget: string }
              - { label: Turnstile Error, name: turnstile_error, widget: string }
              - { label: Error Prefix, name: error_prefix, widget: string }
              - { label: Generic Error, name: generic_error, widget: string }
          - label: Signup Page
            name: signup
            widget: object
            fields:
              - { label: Hero Badge, name: hero_badge, widget: string }
              - { label: Title Prefix, name: title_prefix, widget: string }
              - { label: Title Highlight, name: title_highlight, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Form Heading, name: form_title, widget: string }
              - { label: Full Name Label, name: full_name_label, widget: string }
              - { label: Full Name Placeholder, name: full_name_placeholder, widget: string }
              - { label: Username Label, name: username_label, widget: string }
              - { label: Username Placeholder, name: username_placeholder, widget: string }
              - { label: Email Label, name: email_label, widget: string }
              - { label: Email Placeholder, name: email_placeholder, widget: string }
              - { label: Password Label, name: password_label, widget: string }
              - { label: Password Placeholder, name: password_placeholder, widget: string }
              - { label: Submit Button, name: submit_label, widget: string }
              - { label: Processing Button, name: processing_label, widget: string }
              - { label: Login Prompt, name: login_prompt, widget: string }
              - { label: Login Link Label, name: login_link_label, widget: string }
              - { label: Turnstile Error, name: turnstile_error, widget: string }
              - { label: Success Title, name: success_title, widget: string }
              - { label: Success Message, name: success_message, widget: text }
              - { label: Error Prefix, name: error_prefix, widget: string }
              - { label: Generic Error, name: generic_error, widget: string }
          - label: Dashboard
            name: dashboard
            widget: object
            fields:
              - { label: Hero Badge, name: hero_badge, widget: string }
              - { label: Title Prefix, name: title_prefix, widget: string }
              - { label: Title Highlight, name: title_highlight, widget: string }
              - { label: Welcome Text, name: welcome_prefix, widget: string }
