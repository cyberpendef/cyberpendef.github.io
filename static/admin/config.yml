              - { label: Empty State Icon, name: empty_icon, widget: string }
              - { label: Empty State Heading, name: empty_title, widget: string }
              - { label: Empty State Description, name: empty_description, widget: text }
              - { label: Request Service Button, name: request_service_label, widget: string }
