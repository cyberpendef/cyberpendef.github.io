# Decap CMS configuration for the CyberPenDef Hugo site.
# Production GitHub authentication is proxied through the Cloudflare Worker OAuth service.

backend:
  name: github
  repo: cyberpendef/cyberpendef.github.io
  branch: main
  base_url: https://cyberpendef-decap-oauth.cyberpendef.workers.dev
  auth_endpoint: auth

publish_mode: editorial_workflow
site_url: https://cyberpendef.github.io
display_url: https://cyberpendef.github.io
site_domain: cyberpendef.github.io
logo_url: /logo.png

media_folder: static/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: site_pages
    label: Site Pages
    delete: false
    editor:
      preview: false
    files:
      - name: home
        label: Home Page
        file: content/_index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Type, name: type, widget: hidden, default: home }
          - { label: Body, name: body, widget: markdown, required: false }
      - name: about
        label: About Page
        file: content/about/_index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Hero Title Prefix, name: hero_prefix, widget: string, default: About }
          - { label: Hero Title Highlight, name: hero_highlight, widget: string, default: CyberPenDef }
          - { label: Show Page Header, name: show_page_header, widget: boolean, default: true }
          - { label: Draft, name: draft, widget: boolean, default: false }
          - { label: Body, name: body, widget: markdown, required: false }
      - name: services
        label: Services Page
        file: content/services/_index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Hero Title Prefix, name: hero_prefix, widget: string, default: My }
          - { label: Hero Title Highlight, name: hero_highlight, widget: string, default: Services }
          - { label: Type, name: type, widget: hidden, default: services }
          - { label: Body, name: body, widget: markdown, required: false }
      - name: contact
        label: Contact Page
        file: content/contact/_index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Type, name: type, widget: hidden, default: contact }
          - { label: Layout, name: layout, widget: hidden, default: list }
          - { label: Show Page Header, name: show_page_header, widget: boolean, default: true }
          - { label: Draft, name: draft, widget: boolean, default: false }
          - { label: Body, name: body, widget: markdown, required: false }

  - name: service_catalog
    label: Service Catalog
    files:
      - name: service_catalog
        label: Services and Categories
        file: data/services.yaml
        fields:
          - label: Categories
            name: categories
            widget: list
            fields:
              - { label: Category ID, name: id, widget: string }
              - { label: Icon, name: icon, widget: string }
              - label: Theme
                name: theme
                widget: select
                options: [blue, green, amber]
              - { label: Category Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - label: Services
                name: services
                widget: list
                fields:
                  - { label: Service ID, name: id, widget: string }
                  - { label: Icon, name: icon, widget: string }
                  - label: Icon Color
                    name: icon_color
                    widget: select
                    options: [cyan, amber, green]
                  - { label: Category Tag, name: category, widget: string }
                  - { label: Service Title, name: title, widget: string }
                  - { label: Summary, name: summary, widget: text }
                  - { label: Details Heading, name: details_heading, widget: string }
                  - { label: Details Introduction, name: details_intro, widget: text }
                  - label: Features
                    name: features
                    widget: list
                    field: { label: Feature, name: feature, widget: string }
                  - label: Tags
                    name: tags
                    widget: list
                    fields:
                      - { label: Tag, name: label, widget: string }
                      - label: Tag Color
                        name: theme
                        widget: select
                        options: [cyan, amber, green]
                  - label: Illustration
                    name: illustration
                    widget: select
                    default: generic
                    options:
                      - { label: Generic, value: generic }
                      - { label: Remote Help Desk & Troubleshooting, value: remote-help-desk-troubleshooting }
                      - { label: Tech Support for Freelancers, value: tech-support-for-non-technical-freelancers }
                      - { label: Parental Control Solutions, value: parental-control-solutions }
                      - { label: Server Setup & Deployment, value: server-setup-web-app-deployment }
                      - { label: Personal Device Security Checkup, value: personal-device-security-health-checkup }
                      - { label: Device & Network Security Setup, value: device-network-security-setup }
                      - { label: Cyber Fraud & Crime Support, value: cyber-fraud-crime-support }
                      - { label: Cybersecurity Awareness Training, value: cybersecurity-awareness-training }
                      - { label: Personal Information Security Audit, value: personal-information-security-compliance-audit }
                      - { label: On-Premise to Cloud Migration, value: on-premise-to-cloud-migration }
                      - { label: Backup & Disaster Recovery, value: backup-disaster-recovery-continuity }
                      - { label: Business Process Automation, value: business-process-automation-no-code }
                      - { label: Legacy Modernization, value: legacy-software-hardware-modernization }
                      - { label: Website Security Assessment, value: website-security-assessment }
                      - { label: Security as a Service, value: security-as-a-service-secaas }
                      - { label: Password & Access Management, value: password-access-management }
                      - { label: Embedded C Code Audit, value: secure-code-audit-embedded-c-systems }
                      - { label: Custom Security Tools, value: custom-security-tools-scripts }
                      - { label: Vendor Security Assessment, value: vendor-third-party-security-assessment }
                      - { label: Legacy System Hardening, value: security-hardening-for-legacy-systems }

  - name: about_profile
    label: About Profile
    files:
      - name: profile
        label: About Profile Content
        file: data/about.yaml
        fields:
